apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: go-template

images:
  - name: go-template
    newTag: latest

# configMapGenerator appends a content hash to the ConfigMap name and rewrites
# every reference to it (the Deployment's envFrom). A config change → new hash →
# new name → the Deployment spec changes → Kubernetes performs a rolling update.
# This is what makes a committed env-var change actually reach running pods,
# with no operator required. Overlays extend this with behavior: merge.
configMapGenerator:
  - name: go-template-config
    literals:
      - APP_ENV=prod
      - HTTP_PORT=8080
      - LOG_LEVEL=error # errors-only logging policy (ADR-6); non-error signals are metrics
      - SHUTDOWN_TIMEOUT=20s
      - MESSAGING_DRIVER=memory
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector.observability.svc.cluster.local:4317
      - OTEL_SERVICE_NAME=go-template
      - OTEL_SAMPLE_RATIO=0.1
