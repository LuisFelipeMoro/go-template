apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-template
spec:
  # replicas intentionally omitted — the HPA owns scaling.
  selector:
    matchLabels:
      app.kubernetes.io/name: go-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-template
    spec:
      # Must exceed SHUTDOWN_TIMEOUT (20s) so the drain finishes before SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: go-template
          args: ["server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: go-template-config
          # Secrets belong in a Secret + secretRef — never in the ConfigMap.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
