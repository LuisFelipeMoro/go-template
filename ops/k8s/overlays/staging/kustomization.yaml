apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-template-staging

resources:
  - ../../base

images:
  - name: go-template
    newTag: staging

configMapGenerator:
  - name: go-template-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=error
      - OTEL_SAMPLE_RATIO=0.5
