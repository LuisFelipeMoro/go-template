# Injects secrets (synced from your secret store by External Secrets Operator,
# see external-secret.yaml) into the container environment alongside the
# non-secret ConfigMap. optional:true keeps pods schedulable even before the
# ExternalSecret has reconciled, so the base template runs without ESO too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-template
spec:
  template:
    spec:
      containers:
        - name: app
          envFrom:
            - configMapRef:
                name: go-template-config
            - secretRef:
                name: go-template-secrets
                optional: true
