# GitOps-safe secrets: only references live in git. External Secrets Operator
# (https://external-secrets.io) reads the real values from your backing store
# (AWS Secrets Manager, Vault, GCP Secret Manager, ...) and materializes the
# Kubernetes Secret `go-template-secrets`, which the Deployment mounts via
# envFrom (see deployment-patch.yaml).
#
# Swap for sealed-secrets or SOPS if you prefer — the Deployment only depends on
# the resulting Secret name, not on how it was produced.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: go-template-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store # your ClusterSecretStore / SecretStore
    kind: ClusterSecretStore
  target:
    name: go-template-secrets
    creationPolicy: Owner
  data:
    # Example: a database URL for when STORAGE_DRIVER is switched off memory.
    - secretKey: DATABASE_URL
      remoteRef:
        key: go-template/prod
        property: database_url
