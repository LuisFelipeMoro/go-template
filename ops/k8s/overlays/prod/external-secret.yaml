# GitOps-safe secrets: only references live in git. External Secrets Operator
# (https://external-secrets.io) reads the real values from your backing store
# (AWS Secrets Manager, Vault, GCP Secret Manager, ...) and materializes the
# Kubernetes Secret `go-template-secrets`. Both Deployments in ops/k8s/base
# already mount it via `envFrom: secretRef` with optional: true, so no overlay
# patch is needed — adding this ExternalSecret is enough to populate it.
#
# Swap for sealed-secrets or SOPS if you prefer — the Deployment only depends on
# the resulting Secret name, not on how it was produced.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: go-template-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store # your ClusterSecretStore / SecretStore
    kind: ClusterSecretStore
  target:
    name: go-template-secrets
    creationPolicy: Owner
  data:
    # AUTH_API_KEYS backs AUTH_ENABLED=true from the base ConfigMap. Without
    # this entry the server fails fast at startup rather than serving an
    # unauthenticated API — which is the intended behaviour, but it does mean
    # this key must exist in your store before the first prod rollout.
    - secretKey: AUTH_API_KEYS
      remoteRef:
        key: go-template/prod
        property: auth_api_keys
    # Example: a database URL for when Storer is switched off the in-memory map.
    - secretKey: DATABASE_URL
      remoteRef:
        key: go-template/prod
        property: database_url
