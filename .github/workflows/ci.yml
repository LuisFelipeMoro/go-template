name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Secret guard (no committed env files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed .env / .envrc
        run: |
          # Any tracked env file other than .env.example is a hard failure —
          # enforced server-side even if a contributor skipped `make hooks`.
          offenders=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|(^|/)\.envrc$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::environment files must never be committed:"
            printf '%s\n' "$offenders"
            echo "Remove with: git rm --cached <file>  (commit .env.example instead)"
            exit 1
          fi
          echo "no committed env files ✓"

  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      # v2.13.2 is the first release built with go1.27. The action downloads a
      # PREBUILT binary, and one built with an older Go refuses a module whose
      # `go` directive is newer, so this pin cannot drop below it while go.mod
      # targets 1.27. Keep it equal to GOLANGCI_VERSION in the Makefile.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test (race) + coverage gate
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/... ./pkg/...
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub(/%/,"",$3); print $3}')
          awk "BEGIN{ if ($pct+0 < 85) { print \"coverage \" $pct \"% below 85%\"; exit 1 } }"

      # Generative fuzzing is NOT run here — see .github/workflows/fuzz.yml.
      # The seed corpora (f.Add cases plus anything committed under
      # testdata/fuzz/) are replayed by the `go test` step above on every run,
      # so a regression against a known input still fails this pipeline. Only
      # the search for NEW inputs is opt-in, because it costs minutes per run
      # and rarely finds something in the first 20 seconds that it would not
      # find in a nightly soak.

      - name: Cache govulncheck binary
        id: govulncheck-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-v1.6.0-go1.27

      - name: Vulnerabilities
        run: |
          if [ "${{ steps.govulncheck-cache.outputs.cache-hit }}" != "true" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          fi
          govulncheck ./...

  dupe:
    name: Duplication (jscpd <= 3%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm (jscpd)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: jscpd-${{ runner.os }}-4.0.5

      # Thresholds and ignores live in .jscpd.json so local `make dupe` and CI
      # reach the same verdict.
      - name: Copy-paste detection
        run: npx -y jscpd@4.0.5 .

  spec:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm (spectral-cli)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: spectral-cli-${{ runner.os }}-6.16.3

      - name: Spectral lint
        run: npx -y @stoplight/spectral-cli@6.16.3 lint api-spec.yaml --ruleset .spectral.yaml
