name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# json/v2 (encoding/json/v2 + jsontext) is behind GOEXPERIMENT in Go 1.26 —
# set it for every job so build, vet, test, and govulncheck compile the v2 pkgs.
env:
  GOEXPERIMENT: jsonv2

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Secret guard (no committed env files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed .env / .envrc
        run: |
          # Any tracked env file other than .env.example is a hard failure —
          # enforced server-side even if a contributor skipped `make hooks`.
          offenders=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|(^|/)\.envrc$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::environment files must never be committed:"
            printf '%s\n' "$offenders"
            echo "Remove with: git rm --cached <file>  (commit .env.example instead)"
            exit 1
          fi
          echo "no committed env files ✓"

  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test (race) + coverage gate
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/... ./pkg/...
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub(/%/,"",$3); print $3}')
          awk "BEGIN{ if ($pct+0 < 85) { print \"coverage \" $pct \"% below 85%\"; exit 1 } }"

      # Seeded fuzzing on every PR: short, but enough to catch a parser
      # regression against the committed corpus before it reaches main. The
      # seed corpora in testdata/fuzz/ are replayed by the normal `go test`
      # above; this step additionally generates new inputs.
      - name: Fuzz (short)
        run: |
          set -e
          for pkg in $(go list ./cmd/... ./internal/... ./pkg/...); do
            for fn in $(go test -list='^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              echo "::group::$pkg $fn"
              go test -run='^$' -fuzz="^${fn}$" -fuzztime=20s "$pkg"
              echo "::endgroup::"
            done
          done

      - name: Cache govulncheck binary
        id: govulncheck-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-v1.6.0

      - name: Vulnerabilities
        run: |
          if [ "${{ steps.govulncheck-cache.outputs.cache-hit }}" != "true" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          fi
          govulncheck ./...

  dupe:
    name: Duplication (jscpd <= 3%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm (jscpd)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: jscpd-${{ runner.os }}-4.0.5

      # Thresholds and ignores live in .jscpd.json so local `make dupe` and CI
      # reach the same verdict.
      - name: Copy-paste detection
        run: npx -y jscpd@4.0.5 .

  spec:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm (spectral-cli)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: spectral-cli-${{ runner.os }}-6.16.3

      - name: Spectral lint
        run: npx -y @stoplight/spectral-cli@6.16.3 lint api-spec.yaml --ruleset .spectral.yaml
