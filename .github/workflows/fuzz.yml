name: Fuzz

# Generative fuzzing — deliberately NOT part of the PR pipeline, and its
# schedule ships DISABLED.
#
# What still gates every PR: `go test` in ci.yml replays every fuzz SEED (each
# f.Add case, plus any crasher committed under testdata/fuzz/). A regression
# against a known-bad input therefore still fails CI. What lives here is the
# SEARCH for new inputs, which costs runner minutes by the minute.
#
# ---------------------------------------------------------------------------
# The schedule exists, but is OFF by default — on purpose
# ---------------------------------------------------------------------------
# The cron below fires, but the job is gated on the `FUZZ_SCHEDULE` repository
# variable, which does not exist in a fresh repo — so the run is created and the
# job is skipped. A skipped job allocates no runner and bills no minutes.
#
# That matters because this is a template: every repo generated from it inherits
# this workflow. A nightly soak at 10m/target is ~2,493 minutes a month, which
# on its own exceeds the 2,000 free Actions minutes a private repo gets. Nobody
# should inherit that bill by accident — so turning it on is a deliberate
# one-line act in YOUR repo, not a default in this one.
#
# Enable it without touching any code:
#
#   gh variable set FUZZ_SCHEDULE --body true
#   gh variable set FUZZ_SCHEDULE_FUZZTIME --body 5m    # optional, default 5m
#
# Disable again:
#
#   gh variable delete FUZZ_SCHEDULE
#
# Cadence is the cron below; shipped as weekly (Sunday 03:17 UTC).
#
# Cost baseline — 8 fuzz targets plus ~2 min checkout/setup per run:
#
#   cadence   per target   per run     per month
#   weekly    2m           ~18 min     ~78 min
#   weekly    5m           ~42 min     ~182 min    <- shipped cadence + default
#   nightly   2m           ~18 min     ~547 min
#   nightly   5m           ~42 min     ~1,277 min
#   nightly   10m          ~82 min     ~2,493 min  <- exceeds a private free tier
#
# Public repos get unlimited free minutes on standard runners, so this only
# costs anything in a private repo (Free 2,000/mo, Pro 3,000, Team 3,000).
# Note GitHub also disables scheduled workflows in a public repo after 60 days
# with no repository activity.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Duration per fuzz target (Go duration, e.g. 60s, 5m, 1h)"
        required: false
        default: "5m"
  pull_request:
    types: [labeled]
  schedule:
    # Weekly, Sunday 03:17 UTC — off the hour, so it does not pile onto the rush
    # of jobs everyone else schedules at :00. Inert unless FUZZ_SCHEDULE is set.
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  GOEXPERIMENT: jsonv2

# Never cancel a soak already in flight: a fuzz run killed halfway has told you
# nothing and throws away the corpus it built.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz targets
    # Every trigger is opted into explicitly. `pull_request` fires for EVERY
    # label, so it is narrowed to `fuzz`; `schedule` stays inert until someone
    # sets FUZZ_SCHEDULE. Skipping here costs no runner minutes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'fuzz') ||
      (github.event_name == 'schedule' && vars.FUZZ_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Per-trigger budget. A label run is someone asking about one PR, so it is
      # kept short enough to be useful in review; a scheduled run is the soak and
      # reads its duration from a variable, so cadence and budget are both
      # configurable without editing this file.
      - name: Resolve duration
        id: cfg
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) t="${{ inputs.fuzztime }}" ;;
            pull_request)      t="60s" ;;
            schedule)          t="${{ vars.FUZZ_SCHEDULE_FUZZTIME || '5m' }}" ;;
            *)                 t="5m" ;;
          esac
          echo "fuzztime=$t" >> "$GITHUB_OUTPUT"
          echo "trigger=${{ github.event_name }}, fuzzing each target for $t"

      # Cache the generated corpus so a later run resumes from the coverage an
      # earlier one reached instead of starting cold. Restoring an older key is
      # expected — the corpus only ever grows.
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      # Go fuzzes ONE target per invocation, so each is driven in turn. A crash
      # writes its input to testdata/fuzz/<Target>/ — that file is uploaded
      # below and should be committed, which turns the crash into a permanent
      # regression test replayed by every future `go test`.
      - name: Fuzz
        run: |
          set -e
          failed=0
          for pkg in $(go list ./cmd/... ./internal/... ./pkg/...); do
            for fn in $(go test -list='^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              echo "::group::$fn ($pkg)"
              if ! go test -run='^$' -fuzz="^${fn}$" -fuzztime='${{ steps.cfg.outputs.fuzztime }}' "$pkg"; then
                echo "::error::$fn found a failing input in $pkg"
                failed=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$failed"

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
